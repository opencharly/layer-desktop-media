desktop-media:
    candy:
        description: |
            Desktop media codecs, thumbnailers, and the ALSA<->PipeWire bridge for a KDE workstation
            Installs the GStreamer plugin set (libav/bad/ugly/va/pipewire) so Plasma,
            Phonon and Haruna play every codec, plus the VLC plugins, DVD CSS,
            thumbnailer support libs (libgsf/libopenraw/poppler-glib), and the
            ALSA<->PipeWire bridge with pavucontrol. Mirrors the CachyOS netinstall
            "desktop integration" + "audio" subgroups (host-firmware entries like
            alsa-firmware/sof-firmware are excluded — the VM has no physical audio
            hardware, its streamed/null sinks come from PipeWire). Every package
            lands a known binary, an unsonamed plugin .so, or a config drop-in, so
            each scenario below is a deterministic file/package check.
        require:
            - '@github.com/opencharly/pod-pipewire:v2026.243.0508'
        distro:
            arch:
                package:
                    # GStreamer / codecs
                    - gst-libav
                    - gst-plugin-pipewire
                    - gst-plugins-bad
                    - gst-plugins-ugly
                    - gst-plugin-va
                    - vlc-plugins-all
                    - libdvdcss
                    # Thumbnailer / document libs
                    - ffmpegthumbnailer
                    - libgsf
                    - libopenraw
                    - poppler-glib
                    # ALSA bridge + mixer UI
                    - alsa-utils
                    - alsa-plugins
                    - pipewire-alsa
                    - pavucontrol
        plan:
            - check: the GStreamer libav codec bridge is installed for Plasma/Phonon/Haruna playback
              package:
                package: gst-libav
                installed: true
            - check: the libav GStreamer plugin shared object is present on disk
              file:
                file: /usr/lib/gstreamer-1.0/libgstlibav.so
                exists: true
            - check: the VA-API hardware-decode GStreamer plugin is present
              file:
                file: /usr/lib/gstreamer-1.0/libgstva.so
                exists: true
            - check: the ALSA->PipeWire bridge package is installed so ALSA clients route through PipeWire
              package:
                package: pipewire-alsa
                installed: true
            - check: the PipeWire default-PCM ALSA config drop-in is installed
              file:
                file: /etc/alsa/conf.d/99-pipewire-default.conf
                exists: true
            - check: the pavucontrol mixer UI binary is installed
              file:
                file: /usr/bin/pavucontrol
                exists: true
            - check: the ffmpeg thumbnailer binary is present for video-file previews
              file:
                file: /usr/bin/ffmpegthumbnailer
                exists: true
            - check: the libdvdcss DVD decryption library is installed
              package:
                package: libdvdcss
                installed: true
            - check: the poppler-glib PDF library that backs document thumbnails is installed
              package:
                package: poppler-glib
                installed: true
            - check: package=vlc-plugins-all
              id: vlc-plugins-all-installed
              package:
                package: vlc-plugins-all
                installed: true
            - check: file=/usr/bin/aplay
              id: alsa-utils-aplay
              file:
                file: /usr/bin/aplay
                exists: true

desktop-media-skill:
    skill:
        name: desktop-media
        family: selkies
        owner: desktop-media
        description: |-
            Desktop media codecs, thumbnailers, and the ALSA↔PipeWire bridge for a
            KDE workstation. Use when composing the full KDE/Plasma media stack into
            an image, or when a downstream box needs GStreamer/VLC codec coverage,
            file thumbnails, or ALSA clients routed through PipeWire.
        content: |
            # desktop-media — the KDE workstation media stack

            ## Candy Properties

            | Property | Value |
            |----------|-------|
            | Distro | Arch/CachyOS (`pac` only) |
            | Requires | `@github.com/opencharly/pod-pipewire` — the PipeWire server the ALSA bridge routes through |
            | Service | none (packages only) |

            ## What it installs

            The CachyOS netinstall "desktop integration" + "audio" subgroups: the
            GStreamer plugin set (`gst-libav`, `gst-plugins-bad`,
            `gst-plugins-ugly`, `gst-plugin-va`, `gst-plugin-pipewire`) so Plasma,
            Phonon and Haruna play every codec; the VLC plugin bundle
            (`vlc-plugins-all`) and DVD CSS (`libdvdcss`); thumbnailer support
            (`ffmpegthumbnailer`, `libgsf`, `libopenraw`, `poppler-glib`); and the
            ALSA↔PipeWire bridge (`alsa-utils`, `alsa-plugins`, `pipewire-alsa`)
            with the `pavucontrol` mixer UI.

            Host-firmware entries (`alsa-firmware`, `sof-firmware`) are deliberately
            excluded — the streamed VM has no physical audio hardware; its sinks
            come from PipeWire.

            ## Usage

            Compose it into a KDE/Plasma workstation box:

            ```yaml
            kde-workstation:
              candy:
                base: cachyos-base
                candy:
                  - '@github.com/opencharly/layer-desktop-media:v2026.xxx.yyyy'
            ```

            ## Verification

            `plan:` `check:` steps assert the codec/plugin artifacts on the built
            image: the `gst-libav` package and its `libgstlibav.so`, the VA-API
            `libgstva.so`, the `pipewire-alsa` package and its
            `/etc/alsa/conf.d/99-pipewire-default.conf` drop-in, and the
            `pavucontrol` / `ffmpegthumbnailer` binaries.

            ## Related

            - `/charly-selkies:pipewire` — the audio/media server the ALSA bridge routes through
            - `/charly-selkies:ffmpeg` — the transcoder used by downstream media consumers
            - `/charly-selkies:desktop-fonts` — the sibling desktop font layer
            - `/charly-image:layer` — candy authoring reference
